name: Docker

# ═══════════════════════════════════════════════════════════════════════════
#  Build and publish container images.
# ═══════════════════════════════════════════════════════════════════════════
#
#  The runner has Docker, so images get built and verified here even on a
#  machine that has no container runtime. Every push proves the Dockerfiles
#  actually work — the difference between "designed" and "built".
#
#  Images go to GHCR (ghcr.io), which is free for public repositories and
#  needs no separate registry account: GITHUB_TOKEN already has permission.
#
#  ── Why this matters beyond containers ──────────────────────────────────
#  The image becomes the deployable artifact. Once it exists, the same bytes
#  run on k8s, Railway, Fly, a VM, or docker compose locally — "where it runs"
#  stops being an architectural decision and becomes a deployment one.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      # Don't cancel the other two when one fails — knowing which of the three
      # broke is the useful signal.
      fail-fast: false
      matrix:
        app: [web, dashboard, ingest]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only authenticate for pushes. A pull request from a fork has no write
      # access to the registry, and the build alone is what validates the PR.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root, not the app directory. The apps import packages/*, and a
          # context scoped to the app cannot see them.
          context: .
          file: docker/Dockerfile.${{ matrix.app }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub Actions cache. npm ci is the slow step and it
          # only re-runs when a package.json actually changes.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Report image size
        if: github.event_name != 'pull_request'
        run: |
          echo "### \`${{ matrix.app }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' \
            | grep '${{ matrix.app }}' | head -3 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Proves the images actually RUN — not just that they build. A container that
  # compiles and then dies on boot is a build that told you nothing.
  #
  # The image is rebuilt here rather than pulled from GHCR, reusing the same
  # layer cache so it costs seconds. Pulling would drag registry visibility
  # into the test: a newly published GHCR package is private and unlinked from
  # its repository, so the pull fails on permissions and the failure looks like
  # a broken container rather than a broken token. Building locally keeps this
  # job testing the one thing it is meant to test.
  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ingest image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ingest
          push: false
          load: true
          tags: ollive-ingest:smoke
          cache-from: type=gha,scope=ingest

      - name: Starts and answers /healthz with NO database
        run: |
          docker run -d --name ingest -p 3001:3001 \
            -e DATABASE_URL='postgresql://x:x@localhost:5432/x?sslmode=disable' \
            -e INGEST_API_KEY='smoke-test-key' \
            ollive-ingest:smoke

          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://localhost:3001/healthz >/dev/null; then
              echo "healthz OK after ${i}s: $(curl -s http://localhost:3001/healthz)"
              exit 0
            fi
            sleep 1
          done

          echo "::error::ingest container never became healthy"
          echo "--- container logs ---"
          docker logs ingest 2>&1 | tail -40
          echo "--- state ---"
          docker inspect ingest --format 'running={{.State.Running}} exit={{.State.ExitCode}} err={{.State.Error}}'
          exit 1

      # /healthz is deliberately dependency-free, so it answers even with no
      # database. /readyz must NOT — it should report degraded. Asserting both
      # is what proves the liveness/readiness split is real rather than two
      # endpoints returning the same thing.
      - name: Readiness reports degraded without a database
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://localhost:3001/readyz)
          echo "readyz → HTTP $CODE"
          if [ "$CODE" != "503" ]; then
            echo "::error::expected 503 from /readyz with no database, got $CODE"
            exit 1
          fi

      - name: Graceful shutdown on SIGTERM
        run: |
          # `docker stop` sends SIGTERM. If CMD were `npm start`, npm would be
          # PID 1 and would not forward it — the handler would never fire and
          # the container would be SIGKILLed after the timeout instead.
          docker stop --time 15 ingest
          echo "--- final logs ---"
          docker logs ingest 2>&1 | tail -8
          docker inspect ingest --format 'exit code: {{.State.ExitCode}}'

  # ═══════════════════════════════════════════════════════════════════════════
  #  The bonus item is "Docker Compose ONE-COMMAND setup". Building images
  #  proves the Dockerfiles work; it does not prove `docker compose up` brings
  #  up a working stack. This job runs the actual command a reviewer would run,
  #  from a clean checkout, and asserts the result.
  # ═══════════════════════════════════════════════════════════════════════════
  compose:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: docker compose up
        env:
          # Enough to boot. No model call is made here — this asserts the stack
          # starts, migrates, and answers, not that Anthropic is reachable.
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          INGEST_API_KEY: ci-compose-key
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Schema exists and pgmq is live
        run: |
          # `docker compose up` returning 0 already proves migrations ran —
          # the `migrate` service is gated by service_completed_successfully.
          # What is worth asserting separately is what the migration DECIDED:
          # migration 005 degrades gracefully when pgmq is unavailable, so
          # without this check the stack could come up on the direct sink and
          # the event-bus path would never be exercised while everything
          # looked green.
          echo "--- migrate logs ---"
          docker compose logs migrate 2>&1 | tail -20 || true

          echo "--- schema ---"
          docker compose exec -T db psql -U postgres -d ollive -c "\dt" || true

          MIGRATIONS=$(docker compose exec -T db psql -U postgres -d ollive -tAc             "SELECT count(*) FROM _migrations" 2>/dev/null | tr -cd '0-9')
          PGMQ=$(docker compose exec -T db psql -U postgres -d ollive -tAc             "SELECT to_regnamespace('pgmq') IS NOT NULL" 2>/dev/null | tr -cd 'tf')

          echo "migrations recorded : ${MIGRATIONS:-none}"
          echo "pgmq available      : ${PGMQ:-unknown}"

          if [ "${MIGRATIONS:-0}" -lt 6 ] 2>/dev/null; then
            echo "::error::expected at least 6 migrations, found ${MIGRATIONS:-0}"
            exit 1
          fi
          if [ "$PGMQ" != "t" ]; then
            echo "::error::pgmq missing — the queue sink would silently degrade to direct"
            exit 1
          fi

      - name: All three services answer
        env:
          INGEST_API_KEY: ci-compose-key
        run: |
          fail=0
          check() {
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 "$2" 2>/dev/null || echo 000)
              [ "$code" = "200" ] && { echo "  OK   $1  ($2)"; return 0; }
              sleep 2
            done
            echo "  FAIL $1  ($2) last=$code"; fail=1
          }
          check "ingest  /healthz" http://localhost:3001/healthz
          check "ingest  /readyz"  http://localhost:3001/readyz
          check "web     /healthz" http://localhost:3000/api/healthz
          check "dash    /healthz" http://localhost:3002/api/healthz
          check "dash    /readyz"  http://localhost:3002/api/readyz

          if [ "$fail" != "0" ]; then
            echo "--- logs ---"; docker compose logs --tail 40
            exit 1
          fi

      - name: Telemetry survives the full stack end to end
        run: |
          # Post a batch at the real ingestion service, through the pgmq sink
          # compose configures, and assert it lands in Postgres. This is the
          # whole pipeline: HTTP -> validate -> price -> queue -> worker -> DB.
          curl -sS -X POST http://localhost:3001/v1/events \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-compose-key' \
            -d '{
              "sdk":{"name":"ci","version":"0.1.0"},
              "sentAt":"2026-01-01T00:00:00.000Z",
              "events":[{
                "eventId":"0193b5e0-1c4a-7000-8000-0000000000ff",
                "schemaVersion":1,"provider":"anthropic","model":"claude-opus-5",
                "status":"ok","startedAt":"2026-01-01T00:00:00.000Z",
                "endedAt":"2026-01-01T00:00:01.000Z","latencyMs":1000,
                "inputTokens":10,"outputTokens":20
              }]}' | tee /tmp/ack.json
          echo

          for i in $(seq 1 20); do
            N=$(docker compose exec -T db psql -U postgres -d ollive -tAc \
                 "SELECT count(*) FROM inference_events WHERE event_id='0193b5e0-1c4a-7000-8000-0000000000ff'" 2>/dev/null || echo 0)
            if [ "$N" = "1" ]; then
              echo "event persisted after ${i}s"
              docker compose exec -T db psql -U postgres -d ollive -c \
                "SELECT provider, model, status, latency_ms, cost_usd, pricing_version FROM inference_events WHERE event_id='0193b5e0-1c4a-7000-8000-0000000000ff'"
              exit 0
            fi
            sleep 2
          done

          echo "::error::event never reached the database"
          docker compose logs ingest --tail 40
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v || true
