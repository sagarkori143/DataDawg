# The queue worker.
#
# Same image as the ingestion API, opposite flag. INGEST_WORKER=true, and no
# Service in front of it, because nothing calls it. It reads pgmq and writes to
# Postgres.
#
# Scaling this independently is the point. If the queue backs up you raise
# replicas here and leave the API alone. Running more than one is safe: pgmq
# hands each message to one consumer for the visibility timeout, and the persist
# path de duplicates on event_id anyway, so at least once redelivery cannot
# double count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: datadawg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 20
      initContainers:
        - name: wait-for-schema
          image: datadawg/ingest:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until node packages/db/dist/cli/verify.js; do
                echo "schema not ready, retrying in 3s"
                sleep 3
              done
          envFrom:
            - configMapRef:
                name: datadawg-config
      containers:
        - name: worker
          image: datadawg/ingest:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: INGEST_WORKER
              value: "true"
          envFrom:
            - configMapRef:
                name: datadawg-config
            - secretRef:
                name: datadawg-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          # On a pod that owns the worker, readiness also checks consumer lag.
          # A wedged worker answers /healthz perfectly: the process is alive and
          # HTTP works, it just is not draining anything. Lag is the only signal
          # that separates those two states.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
