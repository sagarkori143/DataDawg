# Copy this to secret.yaml, fill in real values, and apply it.
#
#     cp k8s/02-secret.example.yaml k8s/secret.yaml
#     # edit k8s/secret.yaml
#     kubectl apply -f k8s/secret.yaml
#
# secret.yaml is gitignored. This example file is not, so it must never hold a
# real key.
#
# stringData rather than data, so the values are written as plain text instead
# of base64. Base64 is not encryption and pretending otherwise is how secrets
# end up in commits.
apiVersion: v1
kind: Secret
metadata:
  name: datadawg-secrets
  namespace: datadawg
type: Opaque
stringData:
  ANTHROPIC_API_KEY: sk-ant-replace-me

  # Optional. The chat app offers whichever providers are keyed.
  OPENAI_API_KEY: ""

  # Shared between the SDK and the ingestion service. Any non empty string
  # works locally, but it must be identical in both places or every batch is
  # rejected with 401.
  INGEST_API_KEY: replace-me-with-a-long-random-string

  # Unset means the dashboard metrics API is open. Fine on a laptop cluster.
  DASHBOARD_TOKEN: ""
