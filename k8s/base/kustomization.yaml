apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: datadawg

# secret.yaml is deliberately absent. It is gitignored and applied separately,
# so a `kubectl apply -k k8s/` on a fresh clone cannot accidentally install
# placeholder credentials over real ones.
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 03-postgres.yaml
  - 04-migrate-job.yaml
  - 05-ingest.yaml
  - 06-worker.yaml
  - 07-web.yaml
  - 08-dashboard.yaml

# includeSelectors: false on purpose. A Deployment's selector is immutable once
# created, so folding extra labels into it makes any later change to this block
# a delete and recreate rather than a rolling update.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: datadawg
