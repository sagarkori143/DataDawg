# Render blueprint — the ingestion service.
#
# Web and dashboard deploy to Vercel. This one cannot: it runs the pgmq worker
# in-process, and Vercel freezes a function the moment it returns a response.
# A queue with no drainer is just a table that grows.

services:
  - type: web
    name: datadawg-ingest
    runtime: docker

    # Repo root is the build context. The apps import packages/*, so a context
    # scoped to apps/ingest cannot see them.
    dockerfilePath: ./docker/Dockerfile.ingest
    dockerContext: .

    # Starter, not Free. The free plan sleeps after 15 minutes idle — which
    # stops the worker, backs the queue up, and flatlines the dashboard while
    # every health check still passes. That failure is invisible until you look
    # at the charts, which is the worst kind.
    plan: starter
    region: singapore

    # /healthz, not /readyz. Readiness checks the database, so a brief blip
    # would take the only instance out of rotation with nowhere to shift the
    # traffic. Liveness is dependency-free on purpose.
    healthCheckPath: /healthz

    envVars:
      # Render routes to whatever PORT it assigns; 10000 is its default.
      - key: INGEST_PORT
        value: "10000"
      - key: NODE_ENV
        value: production

      # The whole reason this service runs on its own host.
      - key: INGEST_SINK
        value: pgmq
      - key: INGEST_WORKER
        value: "true"

      # sync: false means "prompt me in the dashboard, never store in git".
      - key: DATABASE_URL
        sync: false
      - key: INGEST_API_KEY
        sync: false
